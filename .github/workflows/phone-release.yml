name: Phone release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phone-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
          cache: false
      - name: Test
        run: |
          go test -race ./...
          go vet ./...
          python3 -m unittest discover -s deploy/phone -p 'test_*.py' -v
      - name: Build ARM64 release
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: arm64
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -X main.buildRevision=$GITHUB_SHA" -o dist/server-linux-arm64 .
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          binary = pathlib.Path('dist/server-linux-arm64').read_bytes()
          pathlib.Path('dist/manifest.json').write_text(json.dumps({
              'revision': os.environ['GITHUB_SHA'],
              'sha256': hashlib.sha256(binary).hexdigest(),
              'size': len(binary),
          }) + '\n')
          PY
      - name: Publish tested build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="phone-$GITHUB_SHA"
          draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [ "$draft" = false ]; then
            echo 'This immutable build has already been published.'
            exit 0
          fi
          if [ -z "$draft" ]; then
            gh release create "$tag" --draft \
              --target "$GITHUB_SHA" --title "Phone build ${GITHUB_SHA:0:12}" \
              --notes "Tested ARM64 build for the phone deployment. Commit: $GITHUB_SHA" \
              --latest=false
          fi
          gh release upload "$tag" dist/server-linux-arm64 dist/manifest.json --clobber
          gh release edit "$tag" --draft=false --latest=false
