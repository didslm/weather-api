worker_processes 1;
pid /run/weather-proxy/nginx.pid;
error_log stderr;
events { worker_connections 1024; }
http {
    # The API already journals every request. Journald sockets cannot be
    # reopened through /dev/stdout by this unprivileged Nginx process.
    access_log off;
    client_body_temp_path /run/weather-proxy/body;
    proxy_temp_path /run/weather-proxy/proxy;
    fastcgi_temp_path /run/weather-proxy/fastcgi;
    uwsgi_temp_path /run/weather-proxy/uwsgi;
    scgi_temp_path /run/weather-proxy/scgi;
    server {
        listen 127.0.0.1:8083;
        server_name weather-api.shtegtimi.com;
        location / {
            include /opt/weather-risk-api/current/upstream.conf;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 3s;
            proxy_read_timeout 60s;
            proxy_buffering off;
        }
    }
}
